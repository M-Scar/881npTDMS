name: Python CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
jobs:
  Test-On-Push:
    runs-on: ubuntu-latest
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Set Up Env
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.7

    - name: Pip Install
      run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

    - name: Disable External Dependencies Tests
      run: |
            mv ./tests/test_saboteur_antisocial_tour_TDMS.py ./tests/saboteur_antisocial_tour_TDMS.py

    - name: Run Tests
      run: |
            coverage run --source=nptdms -m unittest discover
            coverage report -m --omit="*/nptdms/tests/*,*/nptdms/test/*,*/nptdms/export/*,*/nptdms/version.py,*/nptdms/__init__.py"